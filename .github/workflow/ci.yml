name: ci

on:
  workflow_dispatch:
  push:
    branchs:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: setup Go 1.22
        uses: actions/setup-go@v2
        with:
          go-version: 1.22

      - name: build
        uses: go build -o go-web-app

      - name: Go test
        uses: go test ./..

  code-quality:
    runs-on: ubuntu-latest
	
    steps: 
      - name: checkout repository
        uses: actions/checkout@v4
        
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.56.2
        
  push:
    runs-on: ubuntu-latest
    needs: build
      
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
        
      - name: Login to DockerHub
        uses: docker/login-actions@v3
        with:
          username: {{secrets.DOCKERHUB_USERNAME }}
        password: {{secrets.DOCKERHUB_TOKEN }}
        
        - name: Build and Push action
        uses: docker/build-push-action@v6
        with:
          context: .
        file: ./dockerfile
        push: true
        tags: {{ secrets.DOCKERHUB_USERNAME }}/go-web-app:{{github.run_id}}
        
  update-newtag-in-helmchart:
    runs-on: ubuntu-latest
    needs: push
    
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          token: {{ secrets.TOKEN}}
        
      - name: update tag in Helm Chart
        run: |
          sed -i 's/tag: .*/tag: "{{github.run_id}}"/' helm/go-web-app-chart/values.yml
        
      - name: commit and push changes
        run: |
          git config --global user.email "rajeshkawadi181@gmail.com"
          git config --global user.name "NRK1507"
          git add helm/go-web-app-chart/values.yml
          git commit -m "update tag in Helm Chart"
          git push